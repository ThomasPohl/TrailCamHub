AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  TrailCamHub backend: one Lambda function behind a Function URL, a DynamoDB
  table for cameras, media and commands, and an S3 bucket for thumbnails and
  requested videos.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://thomaspohl.github.io
    Description: Browser origin of the gallery web app (CORS).
  ThumbnailRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: Thumbnails older than this are deleted from S3.
  VideoRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: >-
      Requested videos are deleted from S3 this many days after the upload
      (they stay on the hub's SD card).

  FaultMailFrom:
    Type: String
    Default: ''
    NoEcho: true
    Description: >-
      Sender address of the mails about new faults (#265), verified in Amazon
      SES. Empty switches the mails off. CI passes the GitHub secret
      FAULT_MAIL_FROM.
  FaultMailTo:
    Type: String
    Default: ''
    NoEcho: true
    Description: >-
      Recipient of those mails; empty = the sender address. CI passes the
      optional GitHub secret FAULT_MAIL_TO. In the SES sandbox the address
      has to be verified too.

Conditions:
  FaultMailEnabled: !Not [!Equals [!Ref FaultMailFrom, '']]
  FaultMailToSet: !Not [!Equals [!Ref FaultMailTo, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    # Room for the bot messages sent while acknowledging a hub's uploads.
    Timeout: 30
    Tracing: Disabled

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      # Provisioned capacity stays within the DynamoDB always-free tier
      # (on-demand tables are not covered by it).
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
      # Expired samples (BAT#…, FW#…) are deleted by DynamoDB.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-thumbnails
            Status: Enabled
            Prefix: thumb/
            ExpirationInDays: !Ref ThumbnailRetentionDays
          - Id: expire-videos
            Status: Enabled
            Prefix: video/
            ExpirationInDays: !Ref VideoRetentionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # Presigned URLs are used from the Mini App (GET) and the hub (PUT).
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: [!Ref AllowedOrigin]
            MaxAge: 3600

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub '${MediaBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/handler.ts]
        # The Node.js 22 runtime ships the AWS SDK v3.
        External: ['@aws-sdk/*']
        OutExtension: ['.js=.mjs']
    Properties:
      CodeUri: .
      Handler: handler.handler
      Description: TrailCamHub API (gallery app and device endpoints)
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          MEDIA_BUCKET: !Ref MediaBucket
          NODE_OPTIONS: --enable-source-maps
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource:
                - !Sub '${MediaBucket.Arn}/thumb/*'
                - !Sub '${MediaBucket.Arn}/video/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt MediaBucket.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref AllowedOrigin]
          AllowMethods: [GET, POST]
          AllowHeaders: [authorization, content-type]
          MaxAge: 3600

  # Mails the operator about new faults (#265), every 30 minutes. A silent hub
  # cannot report itself, so this runs on a schedule and not at a check-in.
  FaultMailFunction:
    Type: AWS::Serverless::Function
    Condition: FaultMailEnabled
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/handler.ts]
        External: ['@aws-sdk/*']
        OutExtension: ['.js=.mjs']
    Properties:
      CodeUri: .
      Handler: handler.faultMailHandler
      Description: Mails the operator about new faults (#265)
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          MEDIA_BUCKET: !Ref MediaBucket
          FAULT_MAIL_FROM: !Ref FaultMailFrom
          FAULT_MAIL_TO: !If [FaultMailToSet, !Ref FaultMailTo, !Ref FaultMailFrom]
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
      Events:
        Every30Minutes:
          Type: Schedule
          Properties:
            Schedule: rate(30 minutes)

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the API (set as repository variable TRAILCAMHUB_API_BASE_URL)
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref Table
  MediaBucketName:
    Value: !Ref MediaBucket
