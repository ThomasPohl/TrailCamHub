AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  TrailCamHub backend: one Lambda function behind a Function URL, a DynamoDB
  table for cameras, media and commands, and an S3 bucket for thumbnails and
  requested videos.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://thomaspohl.github.io
    Description: Browser origin of the Telegram Mini App (CORS).
  TelegramBotToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Telegram bot token, passed in at deploy time (GitHub secret
      TELEGRAM_BOT_TOKEN). It ends up in a Lambda environment variable. Leave
      empty to read it from SSM instead (TelegramBotTokenParameter).
  TelegramBotTokenParameter:
    Type: String
    Default: ''
    AllowedPattern: '^$|^/[A-Za-z0-9_./-]+$'
    Description: >-
      Optional: name of an SSM SecureString parameter holding the bot token, for
      accounts where Parameter Store is available. Used only if
      TelegramBotToken is empty.
  MiniAppUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://\S+$'
    Description: >-
      URL of the Telegram Mini App, for the "Open app" buttons in bot messages.
      Empty: messages come without that button.
  DefaultTimeZone:
    Type: String
    Default: Europe/Berlin
    Description: >-
      Time zone of a user's quiet hours until they set their own with
      /timezone.
  FirmwareManifestUrl:
    Type: String
    Default: https://github.com/ThomasPohl/TrailCamHub/releases/latest/download/ota.json
    AllowedPattern: '^$|^https://\S+$'
    Description: >-
      Manifest of the latest firmware release (ota.json, written by the CI for
      every vX.Y.Z tag). Hubs running an older release get its image offered at
      check-in and install it. Empty: no firmware updates.
  ThumbnailRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: Thumbnails older than this are deleted from S3.
  VideoRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: >-
      Requested videos are deleted from S3 this many days after the upload
      (they stay on the hub's SD card).

Conditions:
  UseSsmToken: !Not [!Equals [!Ref TelegramBotTokenParameter, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    # Room for the bot messages sent while acknowledging a hub's uploads.
    Timeout: 30
    Tracing: Disabled

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      # Provisioned capacity stays within the DynamoDB always-free tier
      # (on-demand tables are not covered by it).
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
      # Expired pairing codes (PAIR#…) are deleted by DynamoDB.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-thumbnails
            Status: Enabled
            Prefix: thumb/
            ExpirationInDays: !Ref ThumbnailRetentionDays
          - Id: expire-videos
            Status: Enabled
            Prefix: video/
            ExpirationInDays: !Ref VideoRetentionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # Presigned URLs are used from the Mini App (GET) and the hub (PUT).
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: [!Ref AllowedOrigin]
            MaxAge: 3600

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub '${MediaBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        EntryPoints: [src/handler.ts]
        # The Node.js 22 runtime ships the AWS SDK v3.
        External: ['@aws-sdk/*']
        OutExtension: ['.js=.mjs']
    Properties:
      CodeUri: .
      Handler: handler.handler
      Description: TrailCamHub API (app, device and Telegram webhook endpoints)
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          MEDIA_BUCKET: !Ref MediaBucket
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_BOT_TOKEN_PARAM: !Ref TelegramBotTokenParameter
          APP_URL: !Ref MiniAppUrl
          DEFAULT_TIME_ZONE: !Ref DefaultTimeZone
          FIRMWARE_MANIFEST_URL: !Ref FirmwareManifestUrl
          NODE_OPTIONS: --enable-source-maps
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource:
                - !Sub '${MediaBucket.Arn}/thumb/*'
                - !Sub '${MediaBucket.Arn}/video/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt MediaBucket.Arn
            - !If
              - UseSsmToken
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TelegramBotTokenParameter}'
              - !Ref AWS::NoValue
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref AllowedOrigin]
          AllowMethods: [GET, POST]
          AllowHeaders: [authorization, content-type]
          MaxAge: 3600

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the API (set as repository variable TRAILCAMHUB_API_BASE_URL)
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref Table
  MediaBucketName:
    Value: !Ref MediaBucket
