## The ESP32-P4 has no Wi-Fi radio. On that target the esp_wifi API is
## provided by esp_wifi_remote, which forwards it to the ESP32-C6
## co-processor over ESP-Hosted.
dependencies:
  idf: ">=5.3"
  espressif/esp_wifi_remote:
    version: "~1.6.4"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "~2.12.12"
    rules:
      - if: "target in [esp32p4]"
