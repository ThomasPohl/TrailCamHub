name: Guide site

# Builds the guide site from docs/guide/ and checks its links and images (#223).
# It does not publish: the repository has a single GitHub Pages site that the
# deploy-installer job of firmware-package.yml writes (#207). The built site is
# kept as an artifact so a reviewer can look at it.

on:
  pull_request:
    paths:
      - "docs/**"
      - "boards.json"
      - ".github/scripts/build-guide-site.py"
      - ".github/workflows/docs-guide.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "boards.json"
      - ".github/scripts/build-guide-site.py"
      - ".github/workflows/docs-guide.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check guide site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Markdown
        run: pip install "markdown==3.*"

      - name: Build site and check links
        run: python3 .github/scripts/build-guide-site.py site-guide

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: guide-site
          path: site-guide
          retention-days: 7
