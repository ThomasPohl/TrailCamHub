name: Firmware Package

on:
  pull_request:
  push:
    branches:
      - main
      - feature/*
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.board }} deployment package
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        include:
          # Waveshare ESP32-S3-A7670E-4G (published by the installer).
          # board_defaults: an optional sdkconfig file applied on top of
          # sdkconfig.defaults for boards that share a target.
          - board: esp32s3
            target: esp32s3
            board_defaults: ""
          # Waveshare ESP32-P4-NANO (artifact only)
          - board: esp32p4
            target: esp32p4
            board_defaults: ""
          # LilyGO T-Dongle-S3 with display and button (artifact only)
          - board: tdongle-s3
            target: esp32s3
            board_defaults: sdkconfig.defaults.tdongle-s3
          # LilyGO T-Dongle-C5 with display and button (artifact only)
          - board: tdongle-c5
            target: esp32c5
            board_defaults: sdkconfig.defaults.tdongle-c5
    env:
      IDF_PATH: /opt/esp/idf
      BOARD: ${{ matrix.board }}
      TARGET: ${{ matrix.target }}
      BOARD_DEFAULTS: ${{ matrix.board_defaults }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build dev and release merged flash images
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          defaults="sdkconfig.defaults${BOARD_DEFAULTS:+;$BOARD_DEFAULTS}"
          # Dev image: default profile, verbose (INFO) logging.
          .github/scripts/run-annotated.sh "Firmware build" \
            idf.py -D IDF_TARGET="$TARGET" -D SDKCONFIG_DEFAULTS="$defaults" build
          idf.py merge-bin -o "trailcamhub-$BOARD-dev.bin"
          # Release image: size-optimized, warnings-only logging.
          idf.py -B build-release \
            -D IDF_TARGET="$TARGET" \
            -D SDKCONFIG=build-release/sdkconfig \
            -D SDKCONFIG_DEFAULTS="$defaults;sdkconfig.defaults.release" \
            build
          idf.py -B build-release merge-bin -o "trailcamhub-$BOARD-release.bin"

      - name: Assemble deployment package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/trailcamhub-$BOARD"
          mkdir -p "$package_dir"
          cp build/trailcamhub_ble_poc.bin "$package_dir/app.bin"
          cp build/bootloader/bootloader.bin "$package_dir/bootloader.bin"
          cp build/partition_table/partition-table.bin "$package_dir/partition-table.bin"
          cp build/ota_data_initial.bin "$package_dir/ota_data_initial.bin"
          cp "build/trailcamhub-$BOARD-dev.bin" "$package_dir/trailcamhub-$BOARD-dev.bin"
          cp "build-release/trailcamhub-$BOARD-release.bin" "$package_dir/trailcamhub-$BOARD-release.bin"
          cp build/flasher_args.json "$package_dir/flasher_args.json"
          cp deployment/README.md "$package_dir/README.md"
          printf 'Git commit: %s\nESP-IDF: v5.5.6\nBoard: %s\nTarget: %s\n' \
            "$GITHUB_SHA" "$BOARD" "$TARGET" > "$package_dir/BUILD_INFO.txt"
          (
            cd dist
            sha256sum "trailcamhub-$BOARD"/* > "trailcamhub-$BOARD/SHA256SUMS"
            tar -czf "trailcamhub-$BOARD.tar.gz" "trailcamhub-$BOARD"
          )

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: trailcamhub-${{ matrix.board }}
          path: dist/trailcamhub-${{ matrix.board }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  format:
    name: Check C/C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run clang-format 23
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 24.04 does not package LLVM 23; the PyPI wheel pins it.
          pipx install clang-format==23.1.3
          clang-format --version
          git ls-files '*.c' '*.cpp' '*.h' '*.hpp' |
            xargs clang-format --dry-run --Werror

  host-tests:
    name: Host unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and run host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S test/host -B build-host -DCMAKE_BUILD_TYPE=Debug
          .github/scripts/run-annotated.sh "Host test build" cmake --build build-host --parallel
          .github/scripts/run-annotated.sh "Host tests" ctest --test-dir build-host --output-on-failure

      - name: Check the dongle screenshots
        shell: bash
        run: |
          set -euo pipefail
          # The images in docs/ must match what the display code draws.
          cmake -S tools/dongle_screens -B build-screens
          cmake --build build-screens --parallel
          build-screens/dongle_screens docs/images/dongle
          git diff --exit-code -- docs/images/dongle ||
            { echo "::error::Run tools/dongle_screens and commit the images"; exit 1; }

  size-report:
    name: Release size report
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    env:
      IDF_PATH: /opt/esp/idf
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: head

      - name: Check out pull request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Build release profile and report size
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          if [[ -d base ]]; then
            head/.github/scripts/size-report.sh head base
          else
            head/.github/scripts/size-report.sh head
          fi

  deploy-installer:
    name: Deploy web installer
    # Publishes on every push to main, and on a manual "Run workflow" dispatch
    # from any branch (Actions tab) so a branch build can be put on the public
    # installer without merging. Pull requests never deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The Telegram Mini App shares the Pages site with the installer (/app/).
      - name: Build Telegram Mini App
        shell: bash
        working-directory: app
        env:
          VITE_API_BASE_URL: ${{ vars.TRAILCAMHUB_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci; else npm install --no-audit --no-fund; fi
          VITE_APP_VERSION="${GITHUB_SHA:0:7}" npm run build

      - name: Download firmware package
        uses: actions/download-artifact@v8
        with:
          name: trailcamhub-esp32s3
          path: artifact

      - name: Accumulate build and assemble site
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tar -xzf artifact/trailcamhub-esp32s3.tar.gz -C artifact
          pkg=artifact/trailcamhub-esp32s3
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Restore the persistent build store (an orphan branch) or start one.
          if git ls-remote --exit-code --heads "$repo_url" installer-builds >/dev/null 2>&1; then
            git clone --quiet --branch installer-builds --single-branch --depth 1 "$repo_url" store
          else
            mkdir store
            git -C store init -q
            git -C store checkout -q --orphan installer-builds
            echo '{"builds":[]}' > store/versions.json
          fi

          # Add this build under a unique id.
          id="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          dir="store/builds/$id"
          mkdir -p "$dir"
          cp "$pkg/trailcamhub-esp32s3-dev.bin" "$dir/"
          cp "$pkg/trailcamhub-esp32s3-release.bin" "$dir/"
          for variant in dev release; do
            jq --arg v "$id" \
              '.version=$v | .builds[0].parts[0].path=("./trailcamhub-esp32s3-'"$variant"'.bin")' \
              "web/manifest-$variant.json" > "$dir/manifest-$variant.json"
          done
          (cd "$dir" && sha256sum trailcamhub-esp32s3-dev.bin \
            trailcamhub-esp32s3-release.bin > SHA256SUMS)

          # Prepend to the version index and keep the newest 20 builds.
          date_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          message="$(git log -1 --pretty=%s "$GITHUB_SHA" 2>/dev/null || echo '')"
          jq --arg id "$id" --arg date "$date_iso" --arg commit "${GITHUB_SHA:0:7}" \
             --arg branch "${GITHUB_REF_NAME:-}" --arg message "$message" \
             '.builds = ([{id:$id,date:$date,commit:$commit,branch:$branch,message:$message,
                           dev:("builds/"+$id+"/manifest-dev.json"),
                           release:("builds/"+$id+"/manifest-release.json"),
                           devBin:("builds/"+$id+"/trailcamhub-esp32s3-dev.bin"),
                           releaseBin:("builds/"+$id+"/trailcamhub-esp32s3-release.bin")}]
                          + .builds) | .builds = (.builds | .[0:20])' \
             store/versions.json > store/versions.json.tmp
          mv store/versions.json.tmp store/versions.json
          keep="$(jq -r '.builds[].id' store/versions.json)"
          for d in store/builds/*/; do
            bid="$(basename "$d")"
            grep -qx "$bid" <<<"$keep" || rm -rf "$d"
          done

          # Commit and push the store.
          git -C store config user.name "github-actions[bot]"
          git -C store config user.email "github-actions[bot]@users.noreply.github.com"
          git -C store remote set-url origin "$repo_url" 2>/dev/null \
            || git -C store remote add origin "$repo_url"
          git -C store add -A
          git -C store commit -q -m "installer build $id" || echo "nothing to commit"
          git -C store push -q origin installer-builds

          # Assemble the published site: page assets + all stored builds.
          mkdir -p site
          cp web/*.html web/*.css web/*.js site/
          cp store/versions.json site/
          cp -r store/builds site/builds
          cp -r app/dist site/app

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5